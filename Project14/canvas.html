<body>

    <div class="canvas-section">

        <h1 class="canvas-title">Rune Runner</h1>
        <p class="canvas-subtitle">Don't get tagged -- or chase them down!</p>

        <div class="game-status">
            <div class="status-text">Tagged: <span id="taggedDisplay">--</span></div>
            <div class="status-text">Status: <span id="gameStatus">Evade!</span></div>
            <div class="status-text">Score: <span id="scoreDisplay">0</span></div>
            <div class="status-text">Boost: <span id="boostStatus">None</span></div>
        </div>

        <!-- THE CANVAS -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="game-controls">
            <div class="controls-hint">
                Move with <span>W A S D</span> or <span>Arrow Keys</span>
            </div>
            <div class="audio-wrapper">
                <span class="audio-label">Background Music</span>
                <button id="playMusicBtn">&#9654; Play</button>
                <audio id="bgMusic" loop>
                    <source src="audio/drinkwater.ogg" type="audio/ogg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer-section" id="contact">
