    <a href="index.html" class="nav-brand">
      <span>Gibson Media</span>

    <button class="nav-toggle" aria-label="Toggle menu">
      <span class="hamburger"></span>

<body>
    <main class="dark-section">
        <h1>Memory Game</h1>

        <div class="setup-container">
            <p class="setup-subtitle">Enter your info to begin</p>

            <div class="setup-field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="e.g. Ethan">
                <span class="setup-error" id="firstNameErr"></span>
            </div>

            <div class="setup-field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="e.g. Gibson">
                <span class="setup-error" id="lastNameErr"></span>
            </div>

            <div class="setup-field">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="e.g. 22" min="1" max="120">
                <span class="setup-error" id="ageErr"></span>
            </div>

            <button class="setup-btn" onclick="startGame()">Start Game &rarr;</button>
        </div>
    </main>

    <script src="scripts/scripts.js"></script>
    <script src="scripts/memory.js"></script>
</body>
</html>
